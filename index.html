<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>INFOLABZ Diwali Tambola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #f3f7ff;
            --bg2: #dfeaff;
            --card: rgba(255, 255, 255, .78);
            --text: #0b2a63;
            --muted: #5a72a0;
            --accent: #e08a00;
            --accent2: #ffc247;
            --blue: #1769e0;
            --cell: #eef3ff;
            --cellText: #47629a;
            --border: rgba(23, 105, 224, .18);
            --shadow: 0 10px 30px rgba(23, 105, 224, .15);
            --onGold: #3a2200;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        @media (prefers-color-scheme:dark) {
             :root:not([data-theme="light"]) {
                --bg: #06173a;
                --bg2: #0b2a63;
                --card: rgba(255, 255, 255, .06);
                --text: #eaf2ff;
                --muted: #9db6e0;
                --accent: #ffb02e;
                --accent2: #ffd36b;
                --blue: #4b9bff;
                --cell: rgba(255, 255, 255, .06);
                --cellText: #8fa9d8;
                --border: rgba(255, 255, 255, .12);
                --shadow: 0 10px 30px rgba(0, 0, 0, .35);
                --onGold: #3a2200;
                color-scheme: dark;
            }
        }
        
         :root[data-theme="dark"] {
            --bg: #06173a;
            --bg2: #0b2a63;
            --card: rgba(255, 255, 255, .06);
            --text: #eaf2ff;
            --muted: #9db6e0;
            --accent: #ffb02e;
            --accent2: #ffd36b;
            --blue: #4b9bff;
            --cell: rgba(255, 255, 255, .06);
            --cellText: #8fa9d8;
            --border: rgba(255, 255, 255, .12);
            --shadow: 0 10px 30px rgba(0, 0, 0, .35);
            --onGold: #3a2200;
            color-scheme: dark;
        }
        
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 600px at 80% -10%, var(--bg2), transparent 60%), var(--bg);
            position: relative;
            overflow-x: hidden
        }
        
        .spark {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0
        }
        
        .spark i {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent2);
            opacity: 0;
            animation: tw 4s infinite
        }
        
        @keyframes tw {
            0%,
            100% {
                opacity: 0;
                transform: scale(.4)
            }
            50% {
                opacity: .8;
                transform: scale(1.2)
            }
        }
        
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px
        }
        
        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 4px 16px
        }
        
        .logo {
            width: 96px;
            height: 96px;
            flex: none;
            filter: drop-shadow(0 0 14px rgba(255, 176, 46, .55))
        }
        
        @media (max-width:560px) {
            .logo {
                width: 68px;
                height: 68px
            }
        }
        
        header h1 {
            margin: 0;
            font-size: clamp(1.15rem, 3vw, 2rem);
            font-weight: 800;
            letter-spacing: .3px
        }
        
        header h1 span {
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }
        
        header p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .9rem
        }
        
        .spacer {
            flex: 1
        }
        
        .icon-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 1.05rem
        }
        
        .layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 16px;
            align-items: start
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 18px;
            backdrop-filter: blur(3px)
        }
        
        .ball-wrap {
            display: flex;
            justify-content: center;
            padding: 22px 0 26px;
            transition: transform .15s ease-out
        }
        
        .cv {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none
        }
        
        #bg3d {
            z-index: 0
        }
        
        #fx {
            z-index: 5
        }
        
        #spk {
            position: fixed;
            left: 0;
            top: 0;
            width: 36px;
            height: 36px;
            pointer-events: none;
            z-index: 9;
            display: none;
            opacity: 0;
            transition: opacity .2s
        }
        
        #spk.on {
            opacity: 1
        }
        
        @media (hover:hover) and (pointer:fine) {
            html,
            body,
            * {
                cursor: none!important
            }
            #spk {
                display: block
            }
        }
        
        .ball {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            position: relative;
            background: radial-gradient(circle at 32% 28%, #fff8dc 0, var(--accent2) 28%, var(--accent) 70%, #b36a00 100%);
            box-shadow: 0 0 0 8px rgba(255, 176, 46, .18), 0 0 50px rgba(255, 176, 46, .55), inset 0 -12px 24px rgba(0, 0, 0, .2);
            color: var(--onGold)
        }
        
        .ball b {
            font-size: 5.6rem;
            font-weight: 800;
            line-height: 1
        }
        
        .ball.idle b {
            font-size: 1.15rem;
            text-align: center;
            padding: 0 30px;
            font-weight: 700
        }
        
        .ball.pop {
            animation: pop .5s cubic-bezier(.2, 1.6, .4, 1)
        }
        
        .ball {
            cursor: pointer
        }
        
        .ball::before {
            content: "";
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            pointer-events: none;
            background: conic-gradient(from 0deg, transparent, var(--accent2), transparent 40%, var(--blue), transparent);
            -webkit-mask: radial-gradient(closest-side, transparent 87%, #000 88%);
            mask: radial-gradient(closest-side, transparent 87%, #000 88%);
            animation: spin 6s linear infinite
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
        
        .ball.rolling {
            animation: shake .12s infinite
        }
        
        @keyframes pop {
            0% {
                transform: scale(.6)
            }
            100% {
                transform: scale(1)
            }
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: rotate(-3deg)
            }
            50% {
                transform: rotate(3deg)
            }
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 8px 0 14px
        }
        
        .stat {
            background: var(--cell);
            border-radius: 14px;
            padding: 10px;
            text-align: center
        }
        
        .stat b {
            display: block;
            font-size: 1.5rem;
            color: var(--accent)
        }
        
        .stat small {
            color: var(--muted)
        }
        
        .btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 14px;
            font: inherit;
            font-weight: 700;
            font-size: 1.15rem;
            cursor: pointer;
            color: var(--onGold);
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            box-shadow: 0 8px 20px rgba(255, 176, 46, .35);
            transition: transform .15s
        }
        
        .btn:hover {
            transform: translateY(-2px)
        }
        
        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none
        }
        
        .btn {
            position: relative;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: radial-gradient(circle at 30% 25%, #ff7a4d, #e0201a 45%, #7d0a0a);
            box-shadow: 0 8px 22px rgba(224, 32, 26, .5), inset 0 -6px 12px rgba(0, 0, 0, .35), inset 0 4px 8px rgba(255, 255, 255, .25);
            text-shadow: 0 2px 4px rgba(0, 0, 0, .4)
        }
        
        .fuse {
            position: absolute;
            top: -20px;
            right: 26px;
            width: 4px;
            height: 22px;
            border-radius: 3px;
            background: repeating-linear-gradient(0deg, #d8b377 0 3px, #8a6a35 3px 6px);
            transform: rotate(14deg);
            transform-origin: bottom
        }
        
        .fuse::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -3px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #ffb02e 50%, rgba(255, 90, 0, 0) 70%);
            animation: flick .4s infinite alternate
        }
        
        @keyframes flick {
            to {
                transform: scale(1.5);
                opacity: .7
            }
        }
        
        .btn.fusing .fuse {
            animation: burn 1s linear forwards
        }
        
        @keyframes burn {
            to {
                height: 5px
            }
        }
        
        .btn.fusing {
            animation: rumble .08s infinite
        }
        
        @keyframes rumble {
            0% {
                transform: translate(-1px, 0)
            }
            50% {
                transform: translate(1px, 1px)
            }
            100% {
                transform: translate(0, -1px)
            }
        }
        
        .btn.blast {
            animation: blast .45s ease-out forwards
        }
        
        @keyframes blast {
            0% {
                transform: scale(1);
                filter: brightness(1)
            }
            25% {
                transform: scale(1.35);
                filter: brightness(3)
            }
            100% {
                transform: scale(1);
                filter: brightness(1)
            }
        }
        
        .wrap.shake {
            animation: shake .4s
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translate(0)
            }
            20% {
                transform: translate(-6px, 3px)
            }
            40% {
                transform: translate(6px, -4px)
            }
            60% {
                transform: translate(-4px, -3px)
            }
            80% {
                transform: translate(4px, 3px)
            }
        }
        
        .row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap
        }
        
        .chip {
            flex: 1;
            min-width: 90px;
            background: var(--cell);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 9px 8px;
            font: inherit;
            font-size: .85rem;
            cursor: pointer
        }
        
        .chip.on {
            background: var(--blue);
            color: #fff;
            border-color: transparent
        }
        
        select.chip {
            appearance: none;
            text-align: center
        }
        
        h3 {
            margin: 16px 0 8px;
            font-size: .95rem;
            color: var(--muted);
            font-weight: 600
        }
        
        .recent {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 44px
        }
        
        .recent span {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 700;
            background: var(--blue);
            color: #fff
        }
        
        .recent span:first-child {
            background: var(--accent);
            color: var(--onGold)
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: clamp(5px, .8vw, 10px)
        }
        
        .cell {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: clamp(10px, 1.4vw, 16px);
            background: var(--cell);
            color: var(--cellText);
            font-weight: 700;
            font-size: clamp(.9rem, 2.2vw, 1.8rem);
            border: 1px solid var(--border);
            transition: all .25s
        }
        
        .cell.active {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: var(--onGold);
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(255, 176, 46, .5)
        }
        
        .cell.latest {
            animation: glow 1.2s ease-in-out infinite;
            transform: scale(1.12)
        }
        
        @keyframes glow {
            50% {
                box-shadow: 0 0 0 6px rgba(255, 176, 46, .35), 0 0 24px var(--accent)
            }
        }
        
        .cell.igniting {
            position: relative;
            z-index: 2;
            color: #fff;
            border-color: transparent;
            background: radial-gradient(circle at 50% 85%, #fff3b0, #ff8a1f 45%, #d12c00);
            animation: fire .25s ease-in-out infinite alternate
        }
        
        @keyframes fire {
            from {
                box-shadow: 0 0 12px 2px rgba(255, 140, 0, .8), 0 -8px 22px rgba(255, 80, 0, .7);
                transform: scale(1.18) rotate(-2deg)
            }
            to {
                box-shadow: 0 0 26px 6px rgba(255, 200, 60, .95), 0 -16px 34px rgba(255, 60, 0, .8);
                transform: scale(1.32) rotate(2deg)
            }
        }
        
        .footer {
            text-align: center;
            color: var(--muted);
            padding: 18px 8px;
            font-size: .9rem
        }
        
        .footer span {
            color: var(--accent);
            font-weight: 700
        }
        
        @media (max-width:900px) {
            .layout {
                grid-template-columns: 1fr
            }
            .ball {
                width: 170px;
                height: 170px
            }
            .ball b {
                font-size: 4.4rem
            }
        }
        
        @media (max-width:560px) {
            .board {
                grid-template-columns: repeat(9, 1fr);
                gap: 4px
            }
            .wrap {
                padding: 10px
            }
            header p {
                display: none
            }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function() {
            var KEY = "infolabz-tambola-v1";
            var called = [],
                rolling = false,
                timer = null,
                voiceOn = true,
                pend = 0,
                igT = 0;
            var $ = function(id) {
                return document.getElementById(id)
            };
            var board = $("board"),
                ball = $("ball"),
                num = $("num");

            // ===== 3D scene + fireworks =====
            var mx = 0,
                my = 0,
                sz3 = null,
                fx3d = null,
                EM = null,
                CH = null,
                CU = null,
                P = [],
                dirty = false;
            var fxc = $('fx'),
                fg = fxc.getContext('2d');
            var COL = ['#ffd36b', '#ffb02e', '#ff6b6b', '#4b9bff', '#ff7ad9', '#7dffb2', '#ffffff'];

                    }
                    a.needsUpdate = true;
                    cam.position.x += (mx * 1.2 - cam.position.x) * .04;
                    cam.position.y += (-my * .8 - cam.position.y) * .04;
                    cam.lookAt(0, 0, 0);
                    R.render(S, cam);
                })();
            }

            // sparkles
            var sp = $("spark");
            for (var i = 0; i < 26; i++) {
                var d = document.createElement("i");
                d.style.left = Math.random() * 100 + "%";
                d.style.top = Math.random() * 100 + "%";
                d.style.animationDelay = (Math.random() * 4) + "s";
                d.style.animationDuration = (3 + Math.random() * 3) + "s";
                sp.appendChild(d);
            }

            // board
            for (var n = 1; n <= 90; n++) {
                var c = document.createElement("div");
                c.className = "cell";
                c.id = "c" + n;
                c.textContent = n;
                board.appendChild(c);
            }

            function save() {
                try {
                    localStorage.setItem(KEY, JSON.stringify(called))
                } catch (e) {}
            }

            function load() {
                try {
                    var s = JSON.parse(localStorage.getItem(KEY) || "[]");
                    if (Array.isArray(s)) called = s.filter(function(x) {
                        return x >= 1 && x <= 90
                    })
                } catch (e) {
                    called = []
                }
            }

            function render() {
                for (var n = 1; n <= 90; n++) {
                    var el = $("c" + n);
                    el.classList.remove("active", "latest", "igniting");
                }
                called.forEach(function(n) {
                    if (n !== pend) $("c" + n).classList.add("active")
                });
                var last = called[called.length - 1];
                if (last) {
                    $("c" + last).classList.add(last === pend ? "igniting" : "latest");
                    ball.classList.remove("idle");
                    num.textContent = last;
                } else {
                    ball.classList.add("idle");
                    num.textContent = "Press Next Number to begin";
                }
                $("calledCount").textContent = called.length;
                $("leftCount").textContent = 90 - called.length;
                $("recent").innerHTML = called.slice(-6).reverse().map(function(n) {
                    return "<span>" + n + "</span>"
                }).join("");
                $("next").disabled = rolling || called.length >= 90;
                if (called.length >= 90) {
                    ball.classList.remove("idle");
                    num.textContent = "🎉";
                    stopAuto();
                }
            }

            function speak(n) {
                if (!voiceOn || !("speechSynthesis" in window)) return;
                try {
                    speechSynthesis.cancel();
                    var t = "Number " + n + (n > 9 ? ". " + String(n).split("").join(" ") : "");
                    var u = new SpeechSynthesisUtterance(t);
                    u.rate = .9;
                    speechSynthesis.speak(u);
                } catch (e) {}
            }

            function next() {
                if (rolling || called.length >= 90) return;
                var pool = [];
                for (var n = 1; n <= 90; n++)
                    if (called.indexOf(n) < 0) pool.push(n);
                var pick = pool[Math.floor(Math.random() * pool.length)];
                rolling = true;
                $("next").disabled = true;
                ball.classList.remove("idle", "pop");
                ball.classList.add("rolling");
                chakri();
                var t = 0,
                    iv = setInterval(function() {
                        num.textContent = 1 + Math.floor(Math.random() * 90);
                        if (++t >= 10) {
                            clearInterval(iv);
                            rolling = false;
                            ball.classList.remove("rolling");
                            called.push(pick);
                            save();
                            clearTimeout(igT);
                            pend = pick;
                            EM = {
                                n: pick,
                                u: performance.now() + 3000
                            };
                            igT = setTimeout(function() {
                                pend = 0;
                                render();
                            }, 3000);
                            render();
                            fire(called.length >= 90 ? 6 : 1);
                            if (fx3d) fx3d(called.length >= 90 ? 6 : 2);
                            boom();
                            void ball.offsetWidth;
                            ball.classList.add("pop");
                            speak(pick);
                        }
                    }, 70);
            }

            function stopAuto() {
                if (timer) {
                    clearInterval(timer);
                    timer = null
                }
                $("auto").classList.remove("on");
                $("auto").textContent = "⏱ Auto: Off"
            }

            function startAuto() {
                stopAuto();
                bomb();
                timer = setInterval(bomb, parseInt($("speed").value, 10));
                $("auto").classList.add("on");
                $("auto").textContent = "⏱ Auto: On";
            }

            $("next").addEventListener("click", bomb);
            $("auto").addEventListener("click", function() {
                timer ? stopAuto() : startAuto()
            });
            $("speed").addEventListener("change", function() {
                if (timer) startAuto()
            });
            $("voice").addEventListener("click", function() {
                voiceOn = !voiceOn;
                this.classList.toggle("on", voiceOn);
                this.textContent = "🔊 Voice: " + (voiceOn ? "On" : "Off");
                if (!voiceOn && "speechSynthesis" in window) try {
                    speechSynthesis.cancel()
                } catch (e) {}
            });
            $("reset").addEventListener("click", function() {
                if (called.length && !confirm("Start a new game? All called numbers will be cleared.")) return;
                stopAuto();
                clearTimeout(igT);
                pend = 0;
                EM = null;
                called = [];
                save();
                render();
            });
            $("theme").addEventListener("click", function() {
                var r = document.documentElement,
                    cur = r.getAttribute("data-theme");
                if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
            });
            document.addEventListener("keydown", function(e) {
                if (e.code === "Space" && e.target.tagName !== "SELECT") {
                    e.preventDefault();
                    bomb();
                }
            });

            var bw = document.querySelector('.ball-wrap');
            document.addEventListener('pointermove', function(e) {
                var x = e.clientX / innerWidth - .5,
                    y = e.clientY / innerHeight - .5;
                mx = x * 2;
                my = y * 2;
                bw.style.transform = 'perspective(700px) rotateY(' + (x * 18) + 'deg) rotateX(' + (-y * 18) + 'deg)';
            });
            $('ball').addEventListener('click', function() {
                fire(2);
                if (fx3d) fx3d(2);
                chakri();
                setTimeout(boom, 1000);
            });
            var spk = $('spk'),
                lx = 0,
                ly = 0;
            document.addEventListener('pointermove', function(e) {
                spk.style.transform = 'translate(' + (e.clientX - 4.5) + 'px,' + (e.clientY - 4.5) + 'px)';
                spk.classList.add('on');
                var dd = Math.hypot(e.clientX - lx, e.clientY - ly);
                lx = e.clientX;
                ly = e.clientY;
                if (!CU) CU = {
                    x: 0,
                    y: 0,
                    s: 0
                };
                CU.x = e.clientX;
                CU.y = e.clientY;
                CU.s += dd;
            });
            document.documentElement.addEventListener('mouseleave', function() {
                spk.classList.remove('on');
                CU = null;
            });
            document.addEventListener('pointerup', function(e) {
                if (e.pointerType === 'touch') CU = null;
            });
            addEventListener('resize', function() {
                fsz();
                if (sz3) sz3();
            });
            try {
                init3d();
            } catch (e) {}
            fsz();
            fl();
            setTimeout(function() {
                fire(3);
            }, 600);
            load();
            render();
        })();
    </script>
</body>

</html>
